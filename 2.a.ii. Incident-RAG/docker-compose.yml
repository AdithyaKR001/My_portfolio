# One-command RAG stack:  docker compose up --build
#
# Startup order (handled by depends_on conditions):
#   ollama (healthy) -> model-pull (chat + embed models) -> ingest (builds Chroma)
#   -> api + chat UI
#
# The Chroma index is built once into a shared named volume, then served read-side.

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15

  model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull ${OLLAMA_MODEL:-llama3.1} && ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
    restart: "no"

  ingest:
    build: .
    depends_on:
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    environment: &llmenv
      - LLM_PROVIDER=ollama
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - OLLAMA_BASE_URL=http://ollama:11434
      - EMBED_PROVIDER=ollama
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - CHROMA_DIR=/app/data/chroma
    volumes:
      - chroma_index:/app/data/chroma
    command: ["python", "-m", "rag.ingest"]
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      ingest:
        condition: service_completed_successfully
    environment: *llmenv
    volumes:
      - chroma_index:/app/data/chroma

  chat:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      ingest:
        condition: service_completed_successfully
    environment: *llmenv
    volumes:
      - chroma_index:/app/data/chroma
    command: ["streamlit", "run", "chat_ui.py", "--server.address=0.0.0.0", "--server.port=8501"]

volumes:
  ollama_models:
  chroma_index:
