# Runs the whole stack with one command:  docker compose up --build
#
# Services:
#   ollama      - the local LLM server (persists models in a named volume)
#   model-pull  - one-shot: pulls the model, then exits
#   app         - the FastAPI copilot, talking to ollama over the compose network
#   streamlit   - the chat UI, at http://localhost:8501
#
# Override the model without editing this file:  OLLAMA_MODEL=qwen2.5 docker compose up --build

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 15
    # --- NVIDIA GPU (optional): uncomment to accelerate inference ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  model-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-llama3.1}"]
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully

  streamlit:
    build: .
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=ollama
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]

volumes:
  ollama_models:
